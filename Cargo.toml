[package]
name = "cfrm"
version = "0.2.0"
edition = "2024"
description = "Authenticated volatile forum API"
repository = "https://github.com/corbet-libs/cfrm"
license-file = "LICENSE.md"
publish = false

[features]
default = ["server"]
server = ["dep:axum", "dep:tokio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
ts-rs = "12"
url = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", optional = true, features = ["rt", "time", "sync", "net", "macros"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
futures-util = "0.3"
