version: 2
updates:
- package-ecosystem: cargo
  directory: /
  schedule:
    interval: daily
  open-pull-requests-limit: 1
  groups:
    cargo:
      patterns:
      - '*'
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 1
  groups:
    actions:
      patterns:
      - '*'
- package-ecosystem: cargo
  directory: /experiments/private-accounting/native
  schedule:
    interval: weekly
  open-pull-requests-limit: 1
- package-ecosystem: cargo
  directory: /.ci/browser-bindgen
  schedule:
    interval: weekly
  open-pull-requests-limit: 1
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 1
- package-ecosystem: npm
  directory: /browser
  schedule:
    interval: weekly
  open-pull-requests-limit: 1
- package-ecosystem: npm
  directory: /experiments/directional-receipts
  schedule:
    interval: weekly
  open-pull-requests-limit: 1
- package-ecosystem: npm
  directory: /experiments/anonymous-permits
  schedule:
    interval: weekly
  open-pull-requests-limit: 1
- package-ecosystem: npm
  directory: /experiments/member-profiles
  schedule:
    interval: weekly
  open-pull-requests-limit: 1
- package-ecosystem: npm
  directory: /experiments/private-reciprocity
  schedule:
    interval: weekly
  open-pull-requests-limit: 1
- package-ecosystem: npm
  directory: /experiments/private-accounting
  schedule:
    interval: weekly
  open-pull-requests-limit: 1
- package-ecosystem: npm
  directory: /runtime/accounting
  schedule:
    interval: weekly
  open-pull-requests-limit: 1
